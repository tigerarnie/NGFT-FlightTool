<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NGFT Flight">
<meta name="theme-color" content="#15325C">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>NGFT Flight Tool</title>
<style>
:root {
  --orange: #E8713A;
  --orange-dark: #D65E26;
  --navy: #15325C;
  --navy-dark: #0F2549;
  --gray: #4A4A4A;
  --text: #2B2B2B;
  --divider: #808080;
  --bg: #F7F7F5;
  --bg-soft: #FAFAF8;
  --bg-panel: #F0F0EC;
  --border: #E5E5E0;
  --green: #2E7D32;
  --amber: #ED6C02;
  --red: #D32F2F;
  --purple: #7B1FA2;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", ui-sans-serif, system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  min-height: 100dvh;
  overscroll-behavior-y: none;
}

body { padding-bottom: env(safe-area-inset-bottom); }

button, input, textarea, select {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

/* ========== HEADER ========== */
.app-header {
  background: var(--navy);
  color: #fff;
  padding: 12px 16px;
  padding-top: calc(12px + env(safe-area-inset-top));
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 3px solid var(--orange);
  position: sticky;
  top: 0;
  z-index: 50;
}
.app-header .brand {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  min-width: 0;
}
.app-header .brand-text { min-width: 0; }
.app-header .brand-name {
  font-weight: 800;
  letter-spacing: 1.5px;
  font-size: 18px;
  line-height: 1;
}
.app-header .brand-tag {
  font-size: 9px;
  opacity: 0.7;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  margin-top: 2px;
}
.app-header .brand-logo {
  height: 36px;
  width: auto;
  display: block;
  max-width: 180px;
}
@media (max-width: 380px) {
  .app-header .brand-logo { height: 30px; max-width: 150px; }
}
.app-header .status {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  white-space: nowrap;
}
.sync-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 5px;
  vertical-align: middle;
}
.sync-dot.synced { background: #7EE8A8; box-shadow: 0 0 6px rgba(126,232,168,0.6); }
.sync-dot.pending { background: #FFD27A; }
.sync-dot.offline { background: #FF8A9A; }
.sync-indicator {
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 12px;
  background: rgba(255,255,255,0.08);
  transition: background 0.15s;
}
.sync-indicator:hover { background: rgba(255,255,255,0.15); }

/* ========== MAIN LAYOUT ========== */
.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 16px;
  padding-bottom: 40px;
}

/* ========== LIST VIEW ========== */
.list-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}
.list-title {
  font-size: 24px;
  font-weight: 700;
  color: var(--navy);
}
.list-subtitle {
  font-size: 13px;
  color: var(--gray);
  margin-top: 2px;
}

.btn {
  border: none;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  padding: 10px 16px;
  font-size: 14px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: background 0.15s, transform 0.05s;
  white-space: nowrap;
}
.btn:active { transform: scale(0.98); }
.btn-primary {
  background: var(--orange);
  color: #fff;
  box-shadow: 0 2px 8px rgba(232,113,58,0.25);
}
.btn-primary:hover { background: var(--orange-dark); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
.btn-secondary {
  background: #fff;
  color: var(--navy);
  border: 1px solid var(--navy);
}
.btn-secondary:hover { background: var(--navy); color: #fff; }
.btn-ghost {
  background: transparent;
  color: var(--gray);
  border: 1px solid var(--border);
}
.btn-ghost:hover { border-color: var(--orange); color: var(--orange); }
.btn-danger {
  background: #fff;
  color: var(--red);
  border: 1px solid var(--red);
}
.btn-danger:hover { background: var(--red); color: #fff; }
.btn-sm { padding: 6px 10px; font-size: 12px; }
.btn-block { width: 100%; }

.flight-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: box-shadow 0.15s, border-color 0.15s;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
}
.flight-card:hover {
  border-color: var(--orange);
  box-shadow: 0 2px 12px rgba(0,0,0,0.05);
}
.flight-card-main .route {
  font-size: 15px;
  font-weight: 700;
  color: var(--navy);
  display: inline-block;
  margin-right: 10px;
}
.flight-card-main .date {
  font-size: 12px;
  color: var(--gray);
  display: inline-block;
  margin-right: 10px;
}
.flight-card-meta {
  font-size: 12px;
  color: var(--gray);
  margin-top: 4px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.flight-card-meta span { display: inline-flex; align-items: center; gap: 4px; }

.pill {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.pill-status-planning { background: #EEE; color: var(--gray); }
.pill-status-inflight { background: rgba(232,113,58,0.15); color: var(--orange); }
.pill-status-debrief { background: rgba(21,50,92,0.15); color: var(--navy); }
.pill-status-complete { background: rgba(46,125,50,0.12); color: var(--green); }

.pill-frat {
  color: #fff;
  padding: 3px 10px;
}
.pill-frat-low { background: var(--green); }
.pill-frat-moderate { background: var(--amber); }
.pill-frat-high { background: var(--red); }
.pill-frat-critical { background: var(--purple); }

.empty-state {
  text-align: center;
  padding: 60px 20px;
  border: 2px dashed var(--border);
  border-radius: 12px;
  color: var(--gray);
  background: #fff;
}
.empty-state-icon {
  font-size: 40px;
  margin-bottom: 10px;
  opacity: 0.5;
}
.empty-state-title {
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
}

/* ========== FLIGHT VIEW ========== */
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--gray);
  font-size: 13px;
  margin-bottom: 12px;
  cursor: pointer;
  background: transparent;
  border: none;
  padding: 4px 0;
}
.back-link:hover { color: var(--orange); }

.flight-header-bar {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 16px;
}
.header-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
}

.tabs {
  display: flex;
  gap: 2px;
  border-bottom: 2px solid var(--bg-panel);
  margin-bottom: 20px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  background: transparent;
  border: none;
  border-bottom: 3px solid transparent;
  padding: 12px 14px;
  font-weight: 500;
  font-size: 13px;
  color: var(--gray);
  cursor: pointer;
  white-space: nowrap;
  margin-bottom: -2px;
  transition: color 0.15s, border-color 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.tab:hover { color: var(--navy); }
.tab.active {
  color: var(--navy);
  font-weight: 700;
  border-bottom-color: var(--orange);
}

.panel { display: none; }
.panel.active { display: block; }

/* ========== CARDS & SECTIONS ========== */
.card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 14px;
}
.card-header {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 14px;
}
.card-letter {
  width: 32px;
  height: 32px;
  border-radius: 6px;
  background: var(--orange);
  color: #fff;
  font-weight: 700;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.card-letter.navy { background: var(--navy); }
.card-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--navy);
  letter-spacing: 0.3px;
}
.card-subtitle {
  font-size: 12px;
  color: var(--gray);
  margin-top: 2px;
}
.card-body { display: grid; gap: 12px; }

.section-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--navy);
  letter-spacing: 0.3px;
  margin-top: 20px;
}
.section-subtitle {
  font-size: 13px;
  color: var(--gray);
  margin: 4px 0 14px;
}

/* ========== FORM CONTROLS ========== */
.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.field-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--gray);
  text-transform: uppercase;
  letter-spacing: 0.8px;
}
.field-hint {
  font-size: 11px;
  color: var(--gray);
  font-style: italic;
  margin-top: 2px;
}
input[type="text"],
input[type="date"],
input[type="number"],
input[type="email"],
input[type="tel"],
input[type="password"],
select,
textarea {
  border: 1px solid #D8D8D2;
  border-radius: 6px;
  padding: 9px 11px;
  font-size: 14px;
  color: var(--text);
  background: #fff;
  outline: none;
  width: 100%;
  font-family: inherit;
  transition: border-color 0.15s;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--orange);
  box-shadow: 0 0 0 3px rgba(232,113,58,0.08);
}
textarea {
  resize: vertical;
  min-height: 70px;
  line-height: 1.5;
}

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.grid-auto { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }

@media (max-width: 540px) {
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .grid-auto { grid-template-columns: 1fr 1fr; }
}

.check {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-size: 13px;
  padding: 8px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: #fff;
}
.check input {
  accent-color: var(--orange);
  width: 16px;
  height: 16px;
  cursor: pointer;
}

/* ========== FRAT ========== */
.frat-row {
  display: grid;
  grid-template-columns: 1.8fr 1fr 1fr 1fr 50px;
  gap: 6px;
  align-items: stretch;
  margin-bottom: 6px;
}
.frat-header {
  display: grid;
  grid-template-columns: 1.8fr 1fr 1fr 1fr 50px;
  gap: 6px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--gray);
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
}
.frat-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  display: flex;
  align-items: center;
  padding: 4px 0;
}
.frat-btn {
  background: #fff;
  border: 1px solid #D8D8D2;
  border-radius: 6px;
  padding: 6px 8px;
  font-size: 11px;
  text-align: left;
  cursor: pointer;
  line-height: 1.3;
  min-height: 40px;
  transition: all 0.1s;
  font-family: inherit;
  color: var(--text);
}
.frat-btn.active-low { background: var(--green); color: #fff; border-color: var(--green); font-weight: 600; }
.frat-btn.active-med { background: var(--amber); color: #fff; border-color: var(--amber); font-weight: 600; }
.frat-btn.active-high { background: var(--red); color: #fff; border-color: var(--red); font-weight: 600; }
.frat-score {
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 18px;
  color: var(--orange);
}
.frat-score.zero { color: var(--divider); }

.frat-total-panel {
  background: var(--bg-panel);
  border-radius: 8px;
  padding: 16px;
  margin-top: 16px;
  border-left: 4px solid var(--gray);
}
.frat-total-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.frat-total-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--gray);
  text-transform: uppercase;
  letter-spacing: 0.8px;
}
.frat-total-num {
  font-size: 32px;
  font-weight: 700;
  color: var(--text);
  display: inline-block;
  margin-right: 8px;
  vertical-align: middle;
}
.frat-total-level {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.8px;
}
.frat-action {
  font-size: 13px;
  color: var(--text);
  font-style: italic;
  flex: 1;
  min-width: 240px;
}

.auto-threats-panel {
  background: rgba(232, 113, 58, 0.06);
  border: 1px dashed var(--orange);
  border-radius: 8px;
  padding: 12px;
  margin-top: 12px;
}
.auto-threats-panel .hdr {
  font-size: 11px;
  font-weight: 700;
  color: var(--orange);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 6px;
}
.auto-threat-item {
  font-size: 13px;
  color: var(--text);
  margin-bottom: 2px;
}

/* ========== INFLIGHT ========== */
.phase-chips {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.phase-chip {
  background: #fff;
  border: 1px solid #D8D8D2;
  color: var(--text);
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.1s;
  font-family: inherit;
  font-weight: 500;
}
.phase-chip.active {
  background: var(--orange);
  color: #fff;
  border-color: var(--orange);
  font-weight: 600;
}

.inflight-input-row {
  display: grid;
  grid-template-columns: 1fr auto auto auto;
  gap: 8px;
  align-items: stretch;
}
.inflight-input-row input {
  font-size: 14px;
}
.icon-btn {
  background: #fff;
  border: 1px solid #D8D8D2;
  border-radius: 6px;
  padding: 0 12px;
  cursor: pointer;
  color: var(--gray);
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  transition: all 0.1s;
}
.icon-btn:hover { border-color: var(--orange); color: var(--orange); }
.icon-btn.critical-on { background: var(--red); color: #fff; border-color: var(--red); }
.icon-btn.mic-active { background: var(--orange); color: #fff; border-color: var(--orange); animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }

.events-phase-block {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 10px;
}
.events-phase-title {
  font-weight: 700;
  color: var(--navy);
  font-size: 14px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.events-count {
  font-size: 11px;
  color: var(--gray);
  font-weight: 500;
}
.event-item {
  display: grid;
  grid-template-columns: 24px 54px 1fr auto auto;
  gap: 8px;
  align-items: center;
  padding: 8px 0;
  border-top: 1px solid var(--bg-panel);
}
.event-item:first-of-type { border-top: none; }
.event-seq {
  background: var(--bg-panel);
  color: var(--gray);
  width: 24px;
  height: 24px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}
.event-seq.critical { background: var(--red); color: #fff; }
.event-note {
  font-size: 13px;
  color: var(--text);
  padding: 3px 6px;
  border-radius: 4px;
  min-height: 20px;
  cursor: text;
  transition: background 0.1s;
  outline: none;
}
.event-note:hover { background: var(--bg-panel); }
.event-note:focus { background: #fff; box-shadow: 0 0 0 2px var(--orange); }
.event-time {
  font-family: ui-monospace, "SF Mono", monospace;
  font-size: 11px;
  color: var(--gray);
  padding: 3px 4px;
  border-radius: 3px;
  cursor: text;
  outline: none;
  transition: background 0.1s;
}
.event-time:hover { background: var(--bg-panel); }
.event-time:focus {
  background: #fff;
  box-shadow: 0 0 0 2px var(--orange);
  font-family: ui-monospace, "SF Mono", monospace !important;
  font-size: 11px !important;
  color: var(--gray) !important;
}
.event-action {
  background: transparent;
  border: none;
  padding: 4px;
  cursor: pointer;
  color: var(--divider);
  font-size: 14px;
}
.event-action:hover { color: var(--red); }
.event-action.crit-on { color: var(--red); }

.empty-phase {
  font-size: 12px;
  color: var(--divider);
  font-style: italic;
  padding: 4px 0;
}

/* ========== DEBRIEF CARRYOVER ========== */
.carryover {
  background: var(--bg-soft);
  border: 1px dashed var(--divider);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 14px;
}
.carryover-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--gray);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 8px;
}
.carryover-sub {
  font-size: 12px;
  font-weight: 600;
  color: var(--navy);
  margin-bottom: 4px;
  margin-top: 8px;
}
.carryover-sub.critical { color: var(--red); }
.carryover ul { padding-left: 18px; margin: 4px 0; font-size: 13px; }
.carryover li { margin-bottom: 2px; }

/* ========== REPORT ========== */
.report-intro {
  background: var(--navy);
  color: #fff;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 14px;
}
.report-intro .hdr {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  opacity: 0.8;
  margin-bottom: 4px;
}
.report-intro .body {
  font-size: 13px;
  opacity: 0.92;
  line-height: 1.6;
}

.report-preview {
  background: var(--bg-soft);
  border-left: 3px solid var(--orange);
  padding: 14px;
  border-radius: 6px;
  white-space: pre-wrap;
  font-family: ui-monospace, "SF Mono", monospace;
  font-size: 12px;
  line-height: 1.55;
  color: var(--text);
  max-height: 460px;
  overflow-y: auto;
}

.report-action-bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
  margin-bottom: 10px;
}

/* ========== TOAST ========== */
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(160px);
  background: var(--navy);
  color: #fff;
  padding: 12px 22px;
  border-radius: 30px;
  font-size: 13px;
  font-weight: 500;
  z-index: 1000;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  max-width: 90vw;
  text-align: center;
  box-shadow: 0 6px 24px rgba(0,0,0,0.25);
  border: 1px solid rgba(255,255,255,0.1);
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.error { background: var(--red); }
.toast.warn { background: var(--amber); }
.toast.success { background: var(--green); }

/* ========== SETUP / MODAL ========== */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(21,50,92,0.65);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 16px;
  backdrop-filter: blur(4px);
}
.modal {
  background: #fff;
  border-radius: 14px;
  max-width: 520px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  padding: 24px;
}
.modal h2 {
  font-size: 18px;
  color: var(--navy);
  margin-bottom: 8px;
}
.modal p {
  font-size: 13px;
  color: var(--gray);
  margin-bottom: 14px;
}
.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 16px;
  flex-wrap: wrap;
}

/* ========== NAV BUTTONS BETWEEN TABS ========== */
.nav-row {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 16px;
}

/* ========== SETUP TAB ========== */
.setup-note {
  background: rgba(232, 113, 58, 0.08);
  border-left: 3px solid var(--orange);
  padding: 12px 14px;
  border-radius: 6px;
  font-size: 12px;
  color: var(--gray);
  line-height: 1.6;
  margin-bottom: 14px;
}
.setup-note strong { color: var(--text); }
.setup-note code {
  background: rgba(0,0,0,0.05);
  padding: 1px 5px;
  border-radius: 3px;
  font-size: 11px;
  color: var(--navy);
}

.status-line {
  font-size: 12px;
  color: var(--gray);
  margin: 10px 0 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ========== UTILITY ========== */
.divider { border-top: 1px dashed var(--divider); padding-top: 12px; margin-top: 4px; }
.mini-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--orange);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

details {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 10px;
}
summary {
  font-size: 13px;
  font-weight: 600;
  color: var(--navy);
  cursor: pointer;
  user-select: none;
}

/* Safe area padding for iPad installed as PWA */
@supports (padding: max(0px)) {
  .app-header { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
  .container { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
}
</style>
</head>

// STATE
// ============================================================
let flights = [];
let students = [];
let courses = [];
let settings = {};
let syncQueue = [];
let currentFlightId = null;
let currentTab = 'list';
let flightSubTab = 'plan';
let currentPhase = PHASES[0];
let criticalToggle = false;
let recognition = null;
let micActive = false;
let lastSyncError = null; // { ts, type, localId, status, message, responseBody }

// ============================================================
// PERSISTENCE
// ============================================================
function loadLocal() {
  try {
    flights = JSON.parse(localStorage.getItem(STORAGE_KEYS.flights) || '[]');
    students = JSON.parse(localStorage.getItem(STORAGE_KEYS.students) || '[]');
    courses = JSON.parse(localStorage.getItem(STORAGE_KEYS.courses) || '[]');
    settings = JSON.parse(localStorage.getItem(STORAGE_KEYS.settings) || '{}');
    syncQueue = JSON.parse(localStorage.getItem(STORAGE_KEYS.queue) || '[]');
    try { lastSyncError = JSON.parse(localStorage.getItem('ngft_last_sync_error') || 'null'); } catch {}
  } catch (e) {
    console.error('Load error:', e);
  }
}
function saveFlights()  { localStorage.setItem(STORAGE_KEYS.flights, JSON.stringify(flights)); }
function saveStudents() { localStorage.setItem(STORAGE_KEYS.students, JSON.stringify(students)); }
function saveCourses()  { localStorage.setItem(STORAGE_KEYS.courses, JSON.stringify(courses)); }
function saveSettings() { localStorage.setItem(STORAGE_KEYS.settings, JSON.stringify(settings)); }
function saveQueue()    { localStorage.setItem(STORAGE_KEYS.queue, JSON.stringify(syncQueue)); updateSyncIndicator(); }

// ============================================================
// DATA MODEL
// ============================================================
function newFlight() {
  const now = new Date();
  return {
    id: 'flight_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
    airtableId: null,
    createdAt: now.toISOString(),
    updatedAt: now.toISOString(),
    status: 'planning',
    header: {
      date: now.toISOString().split('T')[0],
      aircraft: '', tail: '', pic: 'Arne Haeussler',
      studentId: null, courseId: null,
      departure: '', destination: '', etd: '', eta: '', blockTime: '',
    },
    training: { phase: '', objectives: '', syllabusItems: '' },
    frame: {
      context: { mission: '', pressures: '', fitness: '', dutyStatus: '', gutCheck: '' },
      risk: { wxDep: '', wxEnroute: '', wxDest: '', wxAlt: '', airports: '', aircraft: '', fuelMin: '', fuelPlan: '', fuelActual: '', threat1: '', threat2: '', threat3: '' },
      aircraft: { wb: false, fms: false, automationPlan: '', automationTraps: '' },
      mitigation: { perThreat: '', decisionGates: '', stabilizedCriteria: '', diversionTrigger: '' },
      execution: { departure: '', enroute: '', arrival: '', paxBrief: '' },
    },
    frat: { scores: Array(12).fill(0), mitigations: '', autoMappedThreats: [] },
    inflight: { events: [] },
    clear: { critical: '', lossOfMargins: '', errors: '', actionsWorked: '', plusOne: '', trainingNeed: '', mxSquawk: false },
    report: { sent: false, sentDate: '', notes: '' },
  };
}
function newStudent(name) {
  return {
    id: 'student_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
    airtableId: null, createdAt: new Date().toISOString(),
    name: name || '', email: '', phone: '', home_base: '', certificates: '', notes: '',
  };
}
function newCourse(name, studentId) {
  return {
    id: 'course_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
    airtableId: null, createdAt: new Date().toISOString(),
    course_name: name || '', studentId: studentId || null,
    course_type: 'Other', aircraft_type: '',
    start_date: '', end_date: '', status: 'Active', notes: '',
  };
}
function getFlightById(id)  { return flights.find(f => f.id === id); }
function getStudentById(id) { return students.find(s => s.id === id); }
function getCourseById(id)  { return courses.find(c => c.id === id); }

// ============================================================
// FRAT
// ============================================================
function fratTotal(scores)  { return scores.reduce((a, b) => a + (b || 0), 0); }
function fratLevel(total) {
  if (total === 0)   return { label: '—',        color: 'var(--gray)',   action: 'Complete scoring to see risk level.', slug: '' };
  if (total <= 17)   return { label: 'LOW',      color: 'var(--green)',  action: 'Standard operations. Brief normally and proceed.', slug: 'low' };
  if (total <= 25)   return { label: 'MODERATE', color: 'var(--amber)',  action: 'Enhanced briefing. Identify specific mitigations. Consider calling mentor.', slug: 'moderate' };
  if (total <= 30)   return { label: 'HIGH',     color: 'var(--red)',    action: 'Consult mentor. Document mitigations. Strongly consider delay, re-route, or cancel.', slug: 'high' };
  return               { label: 'CRITICAL', color: 'var(--purple)', action: 'Do not depart. The risk stack is too high. No flight is worth it.', slug: 'critical' };
}
function computeAutoThreats(flight) {
  const threats = [];
  flight.frat.scores.forEach((score, i) => {
    if (score === 3) threats.push(FRAT_FACTORS[i].name);
  });
  return threats;
}

// ============================================================
// UPDATE
// ============================================================
function updateFlight(flightId, updater) {
  const f = getFlightById(flightId);
  if (!f) return;
  updater(f);
  f.updatedAt = new Date().toISOString();
  saveFlights();
  enqueueSync('flight', flightId, 'update');
}

// ============================================================
// SYNC QUEUE
// ============================================================
function enqueueSync(type, localId, op) {
  const exists = syncQueue.find(x => x.type === type && x.localId === localId);
  if (!exists) {
    syncQueue.push({ type, localId, op, ts: Date.now() });
  } else {
    exists.ts = Date.now();
  }
  saveQueue();
  if (navigator.onLine) setTimeout(flushQueue, 300);
}


function captureSyncError(type, localId, e) {
  lastSyncError = {
    ts: new Date().toISOString(),
    type, localId,
    status: e.response?.error?.type || e.message.split(':')[0],
    message: e.message,
    responseBody: e.response ? JSON.stringify(e.response, null, 2) : null,
  };
  console.warn(`${type} sync failed:`, e.message, e.response || '');
  try { localStorage.setItem('ngft_last_sync_error', JSON.stringify(lastSyncError)); } catch {}
}

async function flushQueue() {
  if (!navigator.onLine) return;
  if (!syncQueue.length) return;
  if (!settings.airtableToken || !settings.airtableBase) { updateSyncIndicator(); return; }

  updateSyncIndicator('syncing');
  const remaining = [];
  for (const item of syncQueue) {
    let success = false;
    try {
      if (item.type === 'flight') {
        const f = getFlightById(item.localId);
        if (!f) { success = true; continue; }
        success = await syncFlightToAirtable(f);
      } else if (item.type === 'student') {
        const s = getStudentById(item.localId);
        if (!s) { success = true; continue; }
        success = await syncStudentToAirtable(s);
      } else if (item.type === 'course') {
        const c = getCourseById(item.localId);
        if (!c) { success = true; continue; }
        success = await syncCourseToAirtable(c);
      }
    } catch (e) {
      captureSyncError(item.type, item.localId, e);
      success = false;
    }
    if (!success) remaining.push(item);
  }
  syncQueue = remaining;
  saveQueue();
  if (remaining.length === 0) toast('☁️ All synced', 'success');
  else toast(`⚠️ ${remaining.length} pending — will retry`, 'warn');
}

async function manualSync() {
  if (!navigator.onLine) { toast('Offline — cannot sync', 'warn'); return; }
  if (!settings.airtableToken) { toast('Set up Airtable first (Setup tab)', 'warn'); return; }
  toast('Syncing...', 'success');
  await flushQueue();
  await pullFromAirtable();
  renderCurrentView();
}

// ============================================================
// AIRTABLE API
// ============================================================
async function atFetch(path, options = {}) {
  const res = await fetch(`https://api.airtable.com${path}`, {
    ...options,
    headers: {
      'Authorization': `Bearer ${settings.airtableToken}`,
      'Content-Type': 'application/json',
      ...(options.headers || {}),
    },
  });
  const text = await res.text();
  let json;
  try { json = JSON.parse(text); } catch { json = { raw: text }; }
  if (!res.ok) {
    const msg = json.error?.message || json.error?.type || res.statusText;
    const err = new Error(`${res.status}: ${msg}`);
    err.response = json;
    throw err;
  }
  return json;
}

function flightToAirtableFieldsTiered(f) {
  // Returns { core, content, links } - sent in tiers so one failing field doesn't block everything
  const student = getStudentById(f.header.studentId);
  const course = getCourseById(f.header.courseId);
  const frat = fratTotal(f.frat.scores);
  const level = fratLevel(frat);

  const core = {
    flight_id: f.id,
    date: f.header.date || null,
    aircraft: f.header.aircraft || '',
    tail: f.header.tail || '',
    pic: f.header.pic || '',
    departure: f.header.departure || '',
    destination: f.header.destination || '',
    etd: f.header.etd || '',
    eta: f.header.eta || '',
    block_time: f.header.blockTime || '',
    status: f.status,
  };

  const content = {
    training_phase: f.training.phase || '',
    training_objectives: f.training.objectives || '',
    syllabus_items: f.training.syllabusItems || '',
    frame_json: JSON.stringify(f.frame),
    frat_scores: JSON.stringify(f.frat.scores),
    frat_total: frat || 0,
    frat_mitigations: f.frat.mitigations || '',
    clear_json: JSON.stringify(f.clear),
    plus_one: f.clear.plusOne || '',
    report_notes: f.report.notes || '',
    report_sent: !!f.report.sent,
  };
  if (level.slug) content.frat_level = level.label;
  if (f.report.sentDate) content.report_sent_date = f.report.sentDate;

  const links = {};
  if (student && student.airtableId) links.student = [student.airtableId];
  if (course && course.airtableId) links.course = [course.airtableId];

  return { core, content, links };
}

// Legacy alias for compatibility
function flightToAirtableFields(f) {
  const t = flightToAirtableFieldsTiered(f);
  return { ...t.core, ...t.content, ...t.links };
}

async function syncFlightToAirtable(f) {
  // Tiered sync: core first, then progressively add content + links
  const { core, content, links } = flightToAirtableFieldsTiered(f);

  try {
    // Tier 1: core fields + links - required for a meaningful record
    const tier1 = { ...core, ...links };
    if (f.airtableId) {
      await atFetch(`/v0/${settings.airtableBase}/Flights/${f.airtableId}`, {
        method: 'PATCH', body: JSON.stringify({ fields: tier1, typecast: true }),
      });
    } else {
      const res = await atFetch(`/v0/${settings.airtableBase}/Flights`, {
        method: 'POST', body: JSON.stringify({ fields: tier1, typecast: true }),
      });
      f.airtableId = res.id;
      saveFlights();
    }
  } catch (e) {
    captureSyncError('flight-core', f.id, e);
    return false;
  }

  // Tier 2: content fields (FRAME, FRAT, CLEAR, report)
  // If this fails, we still return true because the core sync worked.
  // Try the full content payload first; on failure, try each field individually.
  try {
    await atFetch(`/v0/${settings.airtableBase}/Flights/${f.airtableId}`, {
      method: 'PATCH', body: JSON.stringify({ fields: content, typecast: true }),
    });
  } catch (e) {
    // Full payload failed - try field-by-field to isolate the offender
    console.warn('Content sync failed, isolating:', e.message);
    const failedFields = [];
    for (const [key, value] of Object.entries(content)) {
      try {
        await atFetch(`/v0/${settings.airtableBase}/Flights/${f.airtableId}`, {
          method: 'PATCH', body: JSON.stringify({ fields: { [key]: value }, typecast: true }),
        });
      } catch (e2) {
        failedFields.push({ field: key, error: e2.message });
      }
    }
    if (failedFields.length > 0) {
      const err = new Error(`Content partial fail: ${failedFields.map(f => f.field).join(', ')}`);
      err.response = { failedFields };
      captureSyncError('flight-content', f.id, err);
    }
  }

  // Tier 3: Events - independent of flight content success
  await syncInflightEvents(f);
  return true;
}

async function syncInflightEvents(f) {
  if (!f.airtableId) return;
  try {
    for (const ev of f.inflight.events) {
      const fields = {
        event_id: ev.id,
        flight: [f.airtableId],
        phase: ev.phase,
        time: ev.time,
        note: ev.note,
        critical: !!ev.critical,
        sequence: f.inflight.events.indexOf(ev) + 1,
      };
      if (ev.airtableId) {
        await atFetch(`/v0/${settings.airtableBase}/InflightEvents/${ev.airtableId}`, {
          method: 'PATCH', body: JSON.stringify({ fields, typecast: true }),
        });
      } else {
        const res = await atFetch(`/v0/${settings.airtableBase}/InflightEvents`, {
          method: 'POST', body: JSON.stringify({ fields, typecast: true }),
        });
        ev.airtableId = res.id;
      }
    }
    saveFlights();
  } catch (e) {
    captureSyncError('event', f.id, e);
  }
}

async function syncStudentToAirtable(s) {
  try {
    const fields = {
      name: s.name, email: s.email || '', phone: s.phone || '',
      home_base: s.home_base || '', certificates: s.certificates || '', notes: s.notes || '',
    };
    if (s.airtableId) {
      await atFetch(`/v0/${settings.airtableBase}/Students/${s.airtableId}`, {
        method: 'PATCH', body: JSON.stringify({ fields, typecast: true }),
      });
    } else {
      const res = await atFetch(`/v0/${settings.airtableBase}/Students`, {
        method: 'POST', body: JSON.stringify({ fields, typecast: true }),
      });
      s.airtableId = res.id;
      saveStudents();
    }
    return true;
  } catch (e) { captureSyncError('student', s.id, e); return false; }
}

async function syncCourseToAirtable(c) {
  try {
    const student = getStudentById(c.studentId);
    const fields = {
      course_name: c.course_name,
      course_type: c.course_type || 'Other',
      aircraft_type: c.aircraft_type || '',
      status: c.status || 'Active',
      notes: c.notes || '',
    };
    if (c.start_date) fields.start_date = c.start_date;
    if (c.end_date) fields.end_date = c.end_date;
    if (student && student.airtableId) fields.student = [student.airtableId];
    if (c.airtableId) {
      await atFetch(`/v0/${settings.airtableBase}/Courses/${c.airtableId}`, {
        method: 'PATCH', body: JSON.stringify({ fields, typecast: true }),
      });
    } else {
      const res = await atFetch(`/v0/${settings.airtableBase}/Courses`, {
        method: 'POST', body: JSON.stringify({ fields, typecast: true }),
      });
      c.airtableId = res.id;
      saveCourses();
    }
    return true;
  } catch (e) { captureSyncError('course', c.id, e); return false; }
}

async function pullFromAirtable() {
  if (!navigator.onLine || !settings.airtableToken || !settings.airtableBase) return;
  try {
    const sres = await atFetch(`/v0/${settings.airtableBase}/Students?pageSize=100`);
    if (sres.records) {
      for (const rec of sres.records) {
        const existing = students.find(x => x.airtableId === rec.id);
        if (existing) {
          existing.name = rec.fields.name || existing.name;
          existing.email = rec.fields.email || '';
          existing.phone = rec.fields.phone || '';
          existing.home_base = rec.fields.home_base || '';
          existing.certificates = rec.fields.certificates || '';
          existing.notes = rec.fields.notes || '';
        } else {
          students.push({
            id: 'student_remote_' + rec.id, airtableId: rec.id,
            createdAt: rec.createdTime || new Date().toISOString(),
            name: rec.fields.name || '', email: rec.fields.email || '',
            phone: rec.fields.phone || '', home_base: rec.fields.home_base || '',
            certificates: rec.fields.certificates || '', notes: rec.fields.notes || '',
          });
        }
      }
      saveStudents();
    }
    const cres = await atFetch(`/v0/${settings.airtableBase}/Courses?pageSize=100`);
    if (cres.records) {
      for (const rec of cres.records) {
        const studentAtId = rec.fields.student?.[0];
        const localStudent = students.find(s => s.airtableId === studentAtId);
        const existing = courses.find(x => x.airtableId === rec.id);
        if (existing) {
          existing.course_name = rec.fields.course_name || existing.course_name;
          existing.course_type = rec.fields.course_type || existing.course_type;
          existing.aircraft_type = rec.fields.aircraft_type || '';
          existing.start_date = rec.fields.start_date || '';
          existing.end_date = rec.fields.end_date || '';
          existing.status = rec.fields.status || 'Active';
          existing.notes = rec.fields.notes || '';
          if (localStudent) existing.studentId = localStudent.id;
        } else {
          courses.push({
            id: 'course_remote_' + rec.id, airtableId: rec.id,
            createdAt: rec.createdTime || new Date().toISOString(),
            course_name: rec.fields.course_name || '',
            studentId: localStudent ? localStudent.id : null,
            course_type: rec.fields.course_type || 'Other',
            aircraft_type: rec.fields.aircraft_type || '',
            start_date: rec.fields.start_date || '',
            end_date: rec.fields.end_date || '',
            status: rec.fields.status || 'Active',
            notes: rec.fields.notes || '',
          });
        }
      }
      saveCourses();
    }
  } catch (e) {
    console.warn('Pull failed:', e.message);
  }
}

// ============================================================
// SYNC INDICATOR
// ============================================================
function updateSyncIndicator(forceState) {
  const dot = document.getElementById('syncDot');
  const text = document.getElementById('syncText');
  if (!dot || !text) return;
  if (!navigator.onLine) { dot.className = 'sync-dot offline'; text.textContent = 'Offline'; return; }
  if (forceState === 'syncing') { dot.className = 'sync-dot pending'; text.textContent = 'Syncing…'; return; }
  if (syncQueue.length > 0) { dot.className = 'sync-dot pending'; text.textContent = `${syncQueue.length} pending`; return; }
  if (!settings.airtableToken) { dot.className = 'sync-dot offline'; text.textContent = 'Not configured'; return; }
  dot.className = 'sync-dot synced';
  text.textContent = 'Synced';
}

// ============================================================
// TOAST
// ============================================================
let toastTimer = null;
function toast(msg, variant = '') {
  const el = document.getElementById('toast');
  el.className = 'toast show' + (variant ? ' ' + variant : '');
  el.textContent = msg;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('show'); }, 2600);
}

// ============================================================
function goHome() {
  currentFlightId = null;
  currentTab = 'list';
  renderCurrentView();
}
function openFlight(id) {
  currentFlightId = id;
  currentTab = 'flight';
  flightSubTab = 'plan';
  renderCurrentView();
  window.scrollTo(0, 0);
}
function setFlightTab(tab) { flightSubTab = tab; renderCurrentView(); window.scrollTo(0, 0); }
function openSetup() { currentTab = 'setup'; renderCurrentView(); }

function renderCurrentView() {
  const c = document.getElementById('container');
  if (!c) return;
  if (currentTab === 'list') c.innerHTML = renderList();
  else if (currentTab === 'flight') {
    const f = getFlightById(currentFlightId);
    if (!f) { goHome(); return; }
    c.innerHTML = renderFlightView(f);
  } else if (currentTab === 'setup') c.innerHTML = renderSetup();
  updateSyncIndicator();
}

function renderList() {
  const configured = !!settings.airtableToken;
  const orderedFlights = [...flights].sort((a, b) => {
    return new Date(b.header.date || b.createdAt) - new Date(a.header.date || a.createdAt);
  });

  let html = `
    <div class="list-header">
      <div>
        <div class="list-title">Flights</div>
        <div class="list-subtitle">Plan. Fly. Debrief. Report.</div>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-ghost btn-sm" onclick="openSetup()">⚙ Setup</button>
        <button class="btn btn-primary" onclick="createNewFlight()">＋ New Flight</button>
      </div>
    </div>
  `;

  if (!configured) {
    html += `
      <div class="setup-note" style="margin-bottom:16px;">
        <strong>First time here?</strong> Tap the <strong>Setup</strong> button above to connect this app to your Airtable base. Until then, flights will save locally on this device but won't sync.
      </div>
    `;
  }

  if (orderedFlights.length === 0) {
    html += `
      <div class="empty-state">
        <div class="empty-state-icon">✈</div>
        <div class="empty-state-title">No flights yet</div>
        <div>Create your first flight to begin planning and briefing.</div>
      </div>
    `;
  } else {
    for (const f of orderedFlights) {
      const student = getStudentById(f.header.studentId);
      const course = getCourseById(f.header.courseId);
      const total = fratTotal(f.frat.scores);
      const level = fratLevel(total);
      html += `
        <div class="flight-card" onclick="openFlight('${f.id}')">
          <div class="flight-card-main">
            <div>
              <span class="route">${escapeHtml(f.header.departure || '???')} → ${escapeHtml(f.header.destination || '???')}</span>
              <span class="date">${f.header.date || ''}</span>
              ${total > 0 ? `<span class="pill pill-frat pill-frat-${level.slug}">FRAT ${total} · ${level.label}</span>` : ''}
              <span class="pill pill-status-${f.status}">${f.status}</span>
            </div>
            <div class="flight-card-meta">
              ${f.header.aircraft ? `<span>${escapeHtml(f.header.aircraft)}${f.header.tail ? ' · ' + escapeHtml(f.header.tail) : ''}</span>` : ''}
              ${student ? `<span>👤 ${escapeHtml(student.name)}</span>` : ''}
              ${course ? `<span>📚 ${escapeHtml(course.course_name)}</span>` : ''}
              ${f.training.phase ? `<span>🎯 ${escapeHtml(f.training.phase)}</span>` : ''}
            </div>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); deleteFlightConfirm('${f.id}')">🗑</button>
          </div>
        </div>
      `;
    }
  }
  return html;
}

// RENDER: FLIGHT VIEW
// ============================================================
function renderFlightView(f) {
  const tabs = [
    { id: 'plan',     label: '1. Plan & Brief', icon: '📋' },
    { id: 'inflight', label: '2. Inflight',     icon: '✈' },
    { id: 'debrief',  label: '3. Debrief',      icon: '✓' },
    { id: 'report',   label: '4. Client Report', icon: '🏅' },
  ];
  let html = `
    <button class="back-link" onclick="goHome()">← All flights</button>
    ${renderFlightHeaderBar(f)}
    <div class="tabs">
      ${tabs.map(t => `
        <button class="tab ${flightSubTab === t.id ? 'active' : ''}" onclick="setFlightTab('${t.id}')">
          ${t.icon} ${t.label}
        </button>
      `).join('')}
    </div>
  `;
  if (flightSubTab === 'plan')     html += renderPlanTab(f);
  if (flightSubTab === 'inflight') html += renderInflightTab(f);
  if (flightSubTab === 'debrief')  html += renderDebriefTab(f);
  if (flightSubTab === 'report')   html += renderReportTab(f);
  return html;
}

const DEFAULT_AIRCRAFT_TYPES = [
  // Cessna Citation legacy types (CE-500 type rating)
  'C500', 'C501', 'C550', 'C551', 'S550', 'C560', 'C560 Ultra', 'C560 Encore', 'C560 Encore+',
  // Citation Jet series (CE-525 type rating)
  'C525', 'C25A', 'C25B', 'C25C', 'C25M',
  // Citation Mustang (CE-510 type rating)
  'C510',
];

function collectHistory(getter) {
  const set = new Set();
  flights.forEach(f => {
    const v = getter(f);
    if (v && v.trim()) set.add(v.trim());
  });
  return Array.from(set).sort();
}

function aircraftOptions() {
  const historical = collectHistory(f => f.header.aircraft);
  const all = new Set([...DEFAULT_AIRCRAFT_TYPES, ...historical]);
  return Array.from(all).sort();
}

function renderDatalist(id, values) {
  return `<datalist id="${id}">${values.map(v => `<option value="${escapeHtml(v)}"></option>`).join('')}</datalist>`;
}

function renderFlightHeaderBar(f) {
  return `
    <div class="flight-header-bar">
      <div class="header-grid">
        <div class="field">
          <label class="field-label">Date</label>
          <input type="date" value="${f.header.date || ''}" onchange="updHeader('date', this.value)">
        </div>
        <div class="field">
          <label class="field-label">Aircraft</label>
          <input type="text" list="dl-aircraft" value="${escapeHtml(f.header.aircraft)}" placeholder="CE-525" onchange="updHeader('aircraft', this.value)">
        </div>
        <div class="field">
          <label class="field-label">Tail #</label>
          <input type="text" list="dl-tail" value="${escapeHtml(f.header.tail)}" placeholder="N123AB" onchange="updHeader('tail', this.value)">
        </div>
        <div class="field">
          <label class="field-label">PIC</label>
          <input type="text" value="${escapeHtml(f.header.pic)}" onchange="updHeader('pic', this.value)">
        </div>
        <div class="field">
          <label class="field-label">Student</label>
          <select onchange="pickStudent(this.value)">

          <select onchange="pickCourse(this.value)" ${!f.header.studentId ? 'disabled' : ''}>
            <option value="">— none —</option>
            ${courses.filter(c => !f.header.studentId || c.studentId === f.header.studentId).map(c => `<option value="${c.id}" ${f.header.courseId === c.id ? 'selected' : ''}>${escapeHtml(c.course_name)}</option>`).join('')}
            ${f.header.studentId ? '<option value="__new__">＋ Add new course...</option>' : ''}
          </select>
        </div>
        <div class="field">
          <label class="field-label">Departure</label>
          <input type="text" list="dl-airports" value="${escapeHtml(f.header.departure)}" placeholder="KCHD" onchange="updHeader('departure', this.value)">

          <input type="text" value="${escapeHtml(f.header.etd)}" placeholder="1830Z" onchange="updHeader('etd', this.value)">
        </div>

function updHeader(key, value) { updateFlight(currentFlightId, f => { f.header[key] = value; }); }
function pickStudent(value) {
  if (value === '__new__') {
    const name = prompt('Student name:');
    if (!name || !name.trim()) { renderCurrentView(); return; }
    const s = newStudent(name.trim());
    students.push(s);
    saveStudents();
    enqueueSync('student', s.id, 'create');
    updateFlight(currentFlightId, f => { f.header.studentId = s.id; f.header.courseId = null; });
    renderCurrentView();
    return;
  }
  updateFlight(currentFlightId, f => { f.header.studentId = value || null; f.header.courseId = null; });
  renderCurrentView();
}
function pickCourse(value) {
  if (value === '__new__') {
    const name = prompt('Course name (e.g. "Initial CE-525 — 2026"):');
    if (!name || !name.trim()) { renderCurrentView(); return; }
    const f = getFlightById(currentFlightId);
    const c = newCourse(name.trim(), f.header.studentId);
    courses.push(c);
    saveCourses();
    enqueueSync('course', c.id, 'create');
    updateFlight(currentFlightId, flt => { flt.header.courseId = c.id; });
    renderCurrentView();
    return;
  }
  updateFlight(currentFlightId, flt => { flt.header.courseId = value || null; });
}

function renderFrameSection(letter, title, subtitle, innerHtml) {
  return `
    <div class="card">
      <div class="card-header">
        <div class="card-letter">${letter}</div>
        <div>
          <div class="card-title">${title}</div>

function updFrame(section, key, value) { updateFlight(currentFlightId, f => { f.frame[section][key] = value; }); }
function updFratMitigations(value) { updateFlight(currentFlightId, f => { f.frat.mitigations = value; }); }
function setFrat(idx, value) {
  updateFlight(currentFlightId, f => {
    f.frat.scores[idx] = (f.frat.scores[idx] === value ? 0 : value);
  });
  renderCurrentView();
}
function applyAutoThreat(idx, threatText) {
  updateFlight(currentFlightId, f => {
    const key = ['threat1', 'threat2', 'threat3'][idx];
    if (key) f.frame.risk[key] = threatText;
  });
  renderCurrentView();
}
function advanceStatus(newStatus) {
  updateFlight(currentFlightId, f => { f.status = newStatus; });
  if (newStatus === 'inflight') setFlightTab('inflight');
  else if (newStatus === 'debrief') setFlightTab('debrief');
  else if (newStatus === 'complete') setFlightTab('report');
}

            <div class="event-note" contenteditable="true" spellcheck="true" onblur="updateEventNote('${ev.id}', this.textContent.trim())" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}">${escapeHtml(ev.note)}</div>

          </div>

}

function setPhase(p) {
  // Preserve typed text: don't re-render the entire view, just update chip states
  currentPhase = p;
  const chips = document.querySelectorAll('.phase-chip');
  chips.forEach(chip => {
    if (chip.textContent.trim() === p) chip.classList.add('active');
    else chip.classList.remove('active');
  });
}
function toggleCritical() {
  // Preserve typed text: toggle button state via class, no re-render
  criticalToggle = !criticalToggle;
  const buttons = document.querySelectorAll('.icon-btn');
  buttons.forEach(b => {
    if (b.title === 'Mark critical') {
      if (criticalToggle) b.classList.add('critical-on');
      else b.classList.remove('critical-on');
    }
  });
}
function addEvent() {
  const input = document.getElementById('newEventInput');
  if (!input) return;
  const note = input.value.trim();
  if (!note) return;
  const ev = {
    id: 'ev_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    airtableId: null,
    phase: currentPhase,
    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
    note,
    critical: criticalToggle,
  };
  updateFlight(currentFlightId, f => { f.inflight.events.push(ev); });
  criticalToggle = false;
  renderCurrentView();
}
function deleteEvent(evId) {
  updateFlight(currentFlightId, f => { f.inflight.events = f.inflight.events.filter(e => e.id !== evId); });
  renderCurrentView();
}
function updateEventNote(evId, newText) {
  if (!newText) return; // don't allow empty notes
  const f = getFlightById(currentFlightId);
  if (!f) return;
  const ev = f.inflight.events.find(e => e.id === evId);
  if (!ev || ev.note === newText) return;
  updateFlight(currentFlightId, flt => {
    const e = flt.inflight.events.find(x => x.id === evId);
    if (e) e.note = newText;
  });
  toast('✓ Note updated', 'success');
}

function updateEventTime(evId, newTime) {
  if (!newTime) return;
  const f = getFlightById(currentFlightId);
  if (!f) return;
  const ev = f.inflight.events.find(e => e.id === evId);
  if (!ev || ev.time === newTime) return;
  updateFlight(currentFlightId, flt => {
    const e = flt.inflight.events.find(x => x.id === evId);
    if (e) e.time = newTime;
  });
}

function toggleEventCritical(evId) {
  updateFlight(currentFlightId, f => {
    const ev = f.inflight.events.find(e => e.id === evId);
    if (ev) ev.critical = !ev.critical;
  });
  renderCurrentView();
}

// Voice dictation
function toggleMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Voice dictation not supported on this device', 'warn'); return; }
  if (micActive && recognition) {
    try { recognition.stop(); } catch (e) {}
    return;
  }
  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onstart = () => {
    micActive = true;
    const btn = document.getElementById('micBtn');
    if (btn) btn.classList.add('mic-active');
    toast('🎤 Listening...', 'success');
  };
  recognition.onresult = (e) => {
    const result = e.results[0][0].transcript;
    const input = document.getElementById('newEventInput');
    if (input) {
      input.value = (input.value ? input.value + ' ' : '') + result;
      input.focus();
    }
  };
  recognition.onerror = (e) => { toast('Mic error: ' + e.error, 'warn'); };
  recognition.onend = () => {
    micActive = false;
    const btn = document.getElementById('micBtn');
    if (btn) btn.classList.remove('mic-active');
  };
  try { recognition.start(); } catch (e) { toast('Could not start mic', 'warn'); }
}

    <div class="card">
      <div class="report-action-bar">
        <button class="btn btn-ghost btn-sm" onclick="copyReportText()">⎘ Copy Text</button>
        <button class="btn btn-secondary" onclick="downloadReportDocx()">⬇ Download DOCX</button>
        <button class="btn btn-primary" onclick="printReport()">🖨 Print / PDF</button>
      </div>
      <div class="report-preview" id="reportPreview">${escapeHtml(generated)}</div>
    </div>

    <div class="card" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
      <div>
        <div style="font-size:13px; font-weight:600;">
          ${f.report.sent ? `Report sent on ${f.report.sentDate}` : 'Mark as sent once delivered to client'}
        </div>
        <div style="font-size:12px; color:var(--gray); margin-top:2px;">
          ${student && student.email ? `Client email: ${escapeHtml(student.email)}` : 'No client email on file.'}
        </div>
      </div>
      <button class="btn btn-primary" onclick="markReportSent()" ${f.report.sent ? 'disabled' : ''}>
        ${f.report.sent ? 'Sent ✓' : 'Mark as Sent'}
      </button>
    </div>
  `;
}
function updReportNotes(value) { updateFlight(currentFlightId, f => { f.report.notes = value; }); }
function markReportSent() {
  updateFlight(currentFlightId, f => {
    f.report.sent = true;
    f.report.sentDate = new Date().toISOString().split('T')[0];
  });
  renderCurrentView();
}

// ============================================================
// REPORT GENERATOR (plain text)
// ============================================================
function generateReport(f) {
  const h = f.header, t = f.training, c = f.clear;
  const student = getStudentById(h.studentId);
  const course = getCourseById(h.courseId);
  const frat = fratTotal(f.frat.scores);
  const level = fratLevel(frat);
  const critical = f.inflight.events.filter(e => e.critical);

  const lines = [];
  lines.push('FLIGHT TRAINING REPORT');
  lines.push('='.repeat(60));
  lines.push('');
  lines.push(`Date:        ${h.date || 'N/A'}`);
  lines.push(`Aircraft:    ${h.aircraft || 'N/A'}${h.tail ? ' (' + h.tail + ')' : ''}`);
  lines.push(`Route:       ${h.departure || '???'} → ${h.destination || '???'}`);
  lines.push(`PIC / CFI:   ${h.pic || 'N/A'}`);
  lines.push(`Client:      ${student ? student.name : 'N/A'}`);
  if (course) lines.push(`Course:      ${course.course_name}`);
  if (t.phase) lines.push(`Phase:       ${t.phase}`);
  lines.push('');

  if (f.report.notes) {
    lines.push(f.report.notes.trim());
    lines.push(''); lines.push('');
  }

  lines.push('1. FLIGHT SUMMARY');
  lines.push('-'.repeat(60));
  if (t.objectives) { lines.push(''); lines.push('Training Objectives:'); lines.push(indent(t.objectives)); }
  if (t.syllabusItems) { lines.push(''); lines.push('Syllabus Items Covered:'); lines.push(indent(t.syllabusItems)); }
  if (frat > 0) {
    lines.push('');
    lines.push(`Pre-flight Risk Assessment (FRAT): ${frat} — ${level.label}`);
    if (f.frat.mitigations) { lines.push('Mitigations applied:'); lines.push(indent(f.frat.mitigations)); }
  }
  lines.push(''); lines.push('');

  lines.push('2. FINDINGS');
  lines.push('-'.repeat(60));
  if (c.actionsWorked)    { lines.push(''); lines.push('Strengths & What Went Well:'); lines.push(indent(c.actionsWorked)); }
  if (c.critical || critical.length > 0) {
    lines.push(''); lines.push('Critical Events & High-Workload Moments:');
    if (c.critical) lines.push(indent(c.critical));
    critical.forEach((e, i) => lines.push(indent(`${i + 1}. [${e.phase} · ${e.time}] ${e.note}`)));
  }
  if (c.lossOfMargins) { lines.push(''); lines.push('Loss of Safety Margins:'); lines.push(indent(c.lossOfMargins)); }
  if (c.errors)        { lines.push(''); lines.push('Errors & Decision Analysis:'); lines.push(indent(c.errors)); }
  lines.push(''); lines.push('');

  lines.push('3. RECOMMENDATIONS');
  lines.push('-'.repeat(60));
  if (c.plusOne)      { lines.push(''); lines.push('Primary Focus for Next Flight (+1 Rule):'); lines.push(indent(c.plusOne)); }
  if (c.trainingNeed) { lines.push(''); lines.push('Training Needs / Knowledge Gaps:'); lines.push(indent(c.trainingNeed)); }
  lines.push(''); lines.push('');

  lines.push('4. RECOMMENDED TRAINING PLAN');
  lines.push('-'.repeat(60));
  lines.push('');
  lines.push('Next Session Objectives:');
  lines.push(indent(c.plusOne || '[Carry forward +1 improvement as primary objective for next flight.]'));
  if (c.trainingNeed) { lines.push(''); lines.push('Ground / Self-Study Focus:'); lines.push(indent(c.trainingNeed)); }
  lines.push('');
  lines.push(indent('Recommended cadence and syllabus to be confirmed in next briefing.'));
  lines.push(''); lines.push('');

  lines.push('='.repeat(60));
  lines.push('Arne Haeussler | President, NextGen Flight Training');
  lines.push('ATP 2681397 · CE-525 / CE-510 / CE-500 · CFI');
  lines.push('(480) 269-2292 · arne@citationacademy.com');
  lines.push('citationacademy.com');
  return lines.join('\n');
}
function indent(text, prefix = '  ') { return text.split('\n').map(l => prefix + l).join('\n'); }

function copyReportText() {
  const f = getFlightById(currentFlightId);
  const text = generateReport(f);
  navigator.clipboard.writeText(text).then(() => {
    toast('✓ Copied to clipboard', 'success');
  }).catch(() => toast('Copy failed', 'warn'));
}

async function downloadReportDocx() {
  if (!window.JSZip) {
    try {
      toast('Loading DOCX library...', 'success');
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
    } catch (e) { toast('Could not load DOCX library — use Print/PDF instead', 'warn'); return; }
  }
  const f = getFlightById(currentFlightId);
  const student = getStudentById(f.header.studentId);
  const docXml = buildDocxXml(f, student);

  // Decode the logo from base64 (defined as DOCX_LOGO_B64 constant)
  const logoBinary = atob(DOCX_LOGO_B64);
  const logoBytes = new Uint8Array(logoBinary.length);
  for (let i = 0; i < logoBinary.length; i++) logoBytes[i] = logoBinary.charCodeAt(i);

  const zip = new JSZip();
  zip.file('[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Default Extension="png" ContentType="image/png"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
  <Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>
</Types>`);
  zip.folder('_rels').file('.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);
  zip.folder('word').folder('_rels').file('document.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
  <Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/logo.png"/>
</Relationships>`);
  zip.folder('word').file('styles.xml', buildStylesXml());
  zip.folder('word').file('document.xml', docXml);
  zip.folder('word').folder('media').file('logo.png', logoBytes);

  const blob = await zip.generateAsync({ type: 'blob' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safe = (s) => (s || 'Client').replace(/[^a-zA-Z0-9]/g, '_');
  a.href = url;
  a.download = `NGFT_Report_${safe(student ? student.name : 'Client')}_${f.header.date || 'YYYY-MM-DD'}.docx`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('✓ DOCX downloaded', 'success');
}

function loadScript(url) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = url;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('script load failed'));
    document.head.appendChild(s);
  });
}

function xmlEscape(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function buildStylesXml() {
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:docDefaults>
    <w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/><w:sz w:val="22"/><w:szCs w:val="22"/></w:rPr></w:rPrDefault>
    <w:pPrDefault><w:pPr><w:spacing w:after="120" w:line="276" w:lineRule="auto"/></w:pPr></w:pPrDefault>
  </w:docDefaults>
  <w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/><w:basedOn w:val="Normal"/><w:pPr><w:spacing w:before="240" w:after="120"/></w:pPr><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/><w:b/><w:color w:val="15325C"/><w:sz w:val="32"/></w:rPr></w:style>
  <w:style w:type="paragraph" w:styleId="Heading2"><w:name w:val="heading 2"/><w:basedOn w:val="Normal"/><w:pPr><w:spacing w:before="200" w:after="80"/></w:pPr><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/><w:b/><w:color w:val="15325C"/><w:sz w:val="26"/></w:rPr></w:style>
  <w:style w:type="paragraph" w:styleId="Heading3"><w:name w:val="heading 3"/><w:basedOn w:val="Normal"/><w:pPr><w:spacing w:before="160" w:after="60"/></w:pPr><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/><w:b/><w:color w:val="E8713A"/><w:sz w:val="22"/></w:rPr></w:style>
  <w:style w:type="paragraph" w:styleId="Normal"><w:name w:val="Normal"/></w:style>
</w:styles>`;
}

function p(text, opts = {}) {
  const runProps = [];
  if (opts.bold) runProps.push('<w:b/>');
  if (opts.color) runProps.push(`<w:color w:val="${opts.color}"/>`);
  if (opts.size) runProps.push(`<w:sz w:val="${opts.size}"/>`);
  const rPr = runProps.length ? `<w:rPr>${runProps.join('')}</w:rPr>` : '';
  const pPr = [];
  if (opts.style) pPr.push(`<w:pStyle w:val="${opts.style}"/>`);
  if (opts.align) pPr.push(`<w:jc w:val="${opts.align}"/>`);
  const pPrStr = pPr.length ? `<w:pPr>${pPr.join('')}</w:pPr>` : '';
  const content = xmlEscape(text || '');
  return `<w:p>${pPrStr}<w:r>${rPr}<w:t xml:space="preserve">${content}</w:t></w:r></w:p>`;
}
function pEmpty() { return '<w:p/>'; }

function pImage(rId, widthEmu, heightEmu, alt) {
  // Produces a w:p containing a w:drawing with an inline picture reference.
  return `<w:p>
    <w:pPr><w:spacing w:after="120"/></w:pPr>
    <w:r>
      <w:drawing>
        <wp:inline distT="0" distB="0" distL="0" distR="0" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing">
          <wp:extent cx="${widthEmu}" cy="${heightEmu}"/>
          <wp:effectExtent l="0" t="0" r="0" b="0"/>
          <wp:docPr id="1" name="Logo" descr="${xmlEscape(alt)}"/>
          <wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr>
          <a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">
            <a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">
              <pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">
                <pic:nvPicPr>
                  <pic:cNvPr id="1" name="Logo" descr="${xmlEscape(alt)}"/>
                  <pic:cNvPicPr/>
                </pic:nvPicPr>
                <pic:blipFill>
                  <a:blip xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" r:embed="${rId}"/>
                  <a:stretch><a:fillRect/></a:stretch>
                </pic:blipFill>
                <pic:spPr>
                  <a:xfrm><a:off x="0" y="0"/><a:ext cx="${widthEmu}" cy="${heightEmu}"/></a:xfrm>
                  <a:prstGeom prst="rect"><a:avLst/></a:prstGeom>
                </pic:spPr>
              </pic:pic>
            </a:graphicData>
          </a:graphic>
        </wp:inline>
      </w:drawing>
    </w:r>
  </w:p>`;
}

function buildDocxXml(f, student) {
  const h = f.header;
  const course = getCourseById(h.courseId);
  const tr = f.training;
  const c = f.clear;
  const frat = fratTotal(f.frat.scores);
  const level = fratLevel(frat);
  const critical = f.inflight.events.filter(e => e.critical);

  const body = [];
  // Embedded NGFT logo (2.0" x 0.71")
  body.push(pImage('rId2', 1828800, 651052, 'NGFT · NextGen Flight Training'));
  body.push(p('Flight Training & Mentoring · citationacademy.com', { color: 'E8713A', size: '18' }));
  body.push(pEmpty());
  body.push(p('Flight Training Report', { style: 'Heading1' }));
  body.push(pEmpty());

  body.push(p(`Date: ${h.date || 'N/A'}`, { bold: true }));
  body.push(p(`Aircraft: ${h.aircraft || 'N/A'}${h.tail ? ' (' + h.tail + ')' : ''}`));
  body.push(p(`Route: ${h.departure || '???'} → ${h.destination || '???'}`));
  body.push(p(`PIC / CFI: ${h.pic || 'N/A'}`));
  body.push(p(`Client: ${student ? student.name : 'N/A'}`));
  if (course) body.push(p(`Course: ${course.course_name}`));
  if (tr.phase) body.push(p(`Phase: ${tr.phase}`));
  body.push(pEmpty());

  if (f.report.notes) {
    f.report.notes.split('\n').forEach(line => body.push(p(line)));
    body.push(pEmpty());
  }

  body.push(p('1. Flight Summary', { style: 'Heading2' }));
  if (tr.objectives) {
    body.push(p('Training Objectives', { style: 'Heading3' }));
    tr.objectives.split('\n').forEach(line => body.push(p(line)));
  }
  if (tr.syllabusItems) {
    body.push(p('Syllabus Items Covered', { style: 'Heading3' }));
    tr.syllabusItems.split('\n').forEach(line => body.push(p(line)));
  }
  if (frat > 0) {
    body.push(p('Pre-flight Risk Assessment (FRAT)', { style: 'Heading3' }));
    body.push(p(`Total score: ${frat} — ${level.label}`));
    if (f.frat.mitigations) {
      body.push(p('Mitigations applied:', { bold: true }));
      f.frat.mitigations.split('\n').forEach(line => body.push(p(line)));
    }
  }
  body.push(pEmpty());

  body.push(p('2. Findings', { style: 'Heading2' }));
  if (c.actionsWorked) {
    body.push(p('Strengths & What Went Well', { style: 'Heading3' }));
    c.actionsWorked.split('\n').forEach(line => body.push(p(line)));
  }
  if (c.critical || critical.length > 0) {
    body.push(p('Critical Events & High-Workload Moments', { style: 'Heading3' }));
    if (c.critical) c.critical.split('\n').forEach(line => body.push(p(line)));
    critical.forEach((e, i) => body.push(p(`${i + 1}. [${e.phase} · ${e.time}] ${e.note}`)));
  }
  if (c.lossOfMargins) {
    body.push(p('Loss of Safety Margins', { style: 'Heading3' }));
    c.lossOfMargins.split('\n').forEach(line => body.push(p(line)));
  }
  if (c.errors) {
    body.push(p('Errors & Decision Analysis', { style: 'Heading3' }));
    c.errors.split('\n').forEach(line => body.push(p(line)));
  }
  body.push(pEmpty());

  body.push(p('3. Recommendations', { style: 'Heading2' }));
  if (c.plusOne) {
    body.push(p('Primary Focus for Next Flight (+1 Rule)', { style: 'Heading3' }));
    c.plusOne.split('\n').forEach(line => body.push(p(line)));
  }
  if (c.trainingNeed) {
    body.push(p('Training Needs / Knowledge Gaps', { style: 'Heading3' }));
    c.trainingNeed.split('\n').forEach(line => body.push(p(line)));
  }
  body.push(pEmpty());

  body.push(p('4. Recommended Training Plan', { style: 'Heading2' }));
  body.push(p('Next Session Objectives', { style: 'Heading3' }));
  body.push(p(c.plusOne || '[Carry forward +1 improvement as primary objective for next flight.]'));
  if (c.trainingNeed) {
    body.push(p('Ground / Self-Study Focus', { style: 'Heading3' }));
    c.trainingNeed.split('\n').forEach(line => body.push(p(line)));
  }
  body.push(p('Recommended cadence and syllabus to be confirmed in next briefing.'));
  body.push(pEmpty());
  body.push(pEmpty());

  body.push(p('Respectfully submitted,'));
  body.push(pEmpty());
  body.push(p('Arne Haeussler', { bold: true }));
  body.push(p('President, NextGen Flight Training (NGFT)'));
  body.push(p('ATP 2681397 · CE-525 / CE-510 / CE-500 · CFI'));
  body.push(p('103 S Stellar Parkway, Chandler, AZ 85226'));
  body.push(p('(480) 269-2292 · arne@citationacademy.com'));
  body.push(p('citationacademy.com', { color: '15325C' }));

  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>
    ${body.join('\n    ')}
    <w:sectPr>
      <w:pgSz w:w="12240" w:h="15840"/>
      <w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440"/>
    </w:sectPr>
  </w:body>
</w:document>`;
}

async function saveSetup() {
  const token = document.getElementById('setupToken').value.trim();
  const base  = document.getElementById('setupBase').value.trim();
  if (!token || !base.startsWith('app')) {
    toast('Token and base ID (starts with app) required', 'warn');
    return;
  }
  settings.airtableToken = token;
  settings.airtableBase = base;
  saveSettings();
  toast('Testing connection...', 'success');
  try {
    await atFetch(`/v0/${base}/Students?maxRecords=1`);
    toast('✓ Connected successfully', 'success');
    await pullFromAirtable();
    await flushQueue();
    updateSyncIndicator();
  } catch (e) {
    toast('Connection failed: ' + e.message, 'error');
  }
  renderCurrentView();
}

function clearSetup() {
  if (!confirm('Clear Airtable credentials from this device? Local data will remain but sync will stop until you re-enter credentials.')) return;
  delete settings.airtableToken;
  delete settings.airtableBase;
  saveSettings();
  renderCurrentView();
  toast('Credentials cleared', 'warn');
}

async function pullAll() {
  if (!settings.airtableToken) { toast('Save credentials first', 'warn'); return; }
  toast('Pulling...', 'success');
  await pullFromAirtable();
  toast(`✓ Pulled ${students.length} student(s), ${courses.length} course(s)`, 'success');
  renderCurrentView();
}

function clearAllLocal() {
  if (!confirm('Delete ALL local data (flights, students, courses)? This cannot be undone. Data in Airtable is NOT affected — you can re-pull from the cloud.')) return;
  const check = prompt('Type OK to confirm:');
  if (check !== 'OK') { toast('Cancelled', 'warn'); return; }
  flights = []; students = []; courses = []; syncQueue = [];
  saveFlights(); saveStudents(); saveCourses(); saveQueue();
  toast('All local data cleared', 'warn');
  goHome();
}

function exportBackup() {
  const payload = {
    ngft_backup_version: 1,
    exported_at: new Date().toISOString(),
    source: 'NGFT Flight Tool V1.5',
    device: navigator.userAgent,
    flights,
    students,
    courses,
    settings: { ...settings, airtableToken: settings.airtableToken ? '***REDACTED***' : undefined },
    syncQueue,
    lastSyncError,
  };
  const json = JSON.stringify(payload, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 16);
  a.href = url;
  a.download = `NGFT_Backup_${ts}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast(`✓ Backup exported (${flights.length} flight${flights.length===1?'':'s'})`, 'success');
}

async function importBackup(event) {
  const file = event.target.files[0];
  event.target.value = ''; // reset so same file can be re-imported
  if (!file) return;

  const text = await file.text();
  let data;
  try {
    data = JSON.parse(text);
  } catch (e) {
    toast('Invalid backup file — not valid JSON', 'error');
    return;
  }

  if (!data.ngft_backup_version || !Array.isArray(data.flights)) {
    toast('Not an NGFT backup file', 'error');
    return;
  }

  // Count what's in the file
  const incF = (data.flights || []).length;
  const incS = (data.students || []).length;
  const incC = (data.courses || []).length;

  const choice = prompt(
    `Backup contains:\n• ${incF} flight(s)\n• ${incS} student(s)\n• ${incC} course(s)\n\nType one of:\n  "merge" — keep existing, add missing\n  "replace" — WIPE this device and restore from backup\n  "cancel" — do nothing`,
    'merge'
  );

  if (!choice || choice.toLowerCase() === 'cancel') {
    toast('Import cancelled', 'warn');
    return;
  }

  if (choice.toLowerCase() === 'replace') {
    if (!confirm(`REPLACE all local data with backup? This will wipe ${flights.length} local flight(s) and restore ${incF} from the backup.`)) {
      toast('Cancelled', 'warn');
      return;
    }
    flights = data.flights || [];
    students = data.students || [];
    courses = data.courses || [];
    syncQueue = data.syncQueue || [];
    // Don't restore credentials (they were redacted) or lastSyncError
    saveFlights(); saveStudents(); saveCourses(); saveQueue();
    toast(`✓ Restored ${incF} flight(s)`, 'success');
    renderCurrentView();
    return;
  }

  // Merge: keep existing records, add ones whose IDs aren't already present
  let addedF = 0, addedS = 0, addedC = 0;
  const existingFlightIds = new Set(flights.map(f => f.id));
  for (const f of (data.flights || [])) {
    if (!existingFlightIds.has(f.id)) { flights.push(f); addedF++; }
  }
  const existingStudentIds = new Set(students.map(s => s.id));
  for (const s of (data.students || [])) {
    if (!existingStudentIds.has(s.id)) { students.push(s); addedS++; }
  }
  const existingCourseIds = new Set(courses.map(c => c.id));
  for (const c of (data.courses || [])) {
    if (!existingCourseIds.has(c.id)) { courses.push(c); addedC++; }
  }
  saveFlights(); saveStudents(); saveCourses();
  toast(`✓ Merged: +${addedF} flight(s), +${addedS} student(s), +${addedC} course(s)`, 'success');
  renderCurrentView();
}

function clearLastSyncError() {
  lastSyncError = null;
  localStorage.removeItem('ngft_last_sync_error');
  renderCurrentView();
  toast('Error cleared', 'success');
}

function copyLastSyncError() {
  if (!lastSyncError) return;
  const text = `NGFT Flight Tool — Sync Error
Time: ${lastSyncError.ts}
Type: ${lastSyncError.type}
Record: ${lastSyncError.localId}
Status: ${lastSyncError.status}
Message: ${lastSyncError.message}
Response:
${lastSyncError.responseBody || '(none)'}`;
  navigator.clipboard.writeText(text).then(() => {
    toast('✓ Error copied to clipboard', 'success');
  }).catch(() => toast('Copy failed', 'warn'));
}

function createNewFlight() {
  const f = newFlight();
  flights.push(f);
  saveFlights();
  enqueueSync('flight', f.id, 'create');
  openFlight(f.id);
}

function deleteFlightConfirm(id) {
  if (!confirm('Delete this flight permanently? The record in Airtable will remain unless you remove it manually there.')) return;
  flights = flights.filter(f => f.id !== id);
  saveFlights();
  syncQueue = syncQueue.filter(x => !(x.type === 'flight' && x.localId === id));
  saveQueue();
  renderCurrentView();
  toast('Flight deleted locally', 'warn');
}

// ============================================================
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// INIT
// ============================================================
window.addEventListener('DOMContentLoaded', async () => {
  loadLocal();
  renderCurrentView();
  updateSyncIndicator();
  if (navigator.onLine && settings.airtableToken) {
    await pullFromAirtable();
    renderCurrentView();
    setTimeout(flushQueue, 1500);
  }
  setInterval(() => {
    if (navigator.onLine && syncQueue.length > 0) flushQueue();
  }, 30000);
});

window.addEventListener('online', () => {
  toast('📶 Back online — syncing', 'success');
  updateSyncIndicator();
  setTimeout(flushQueue, 800);
});
window.addEventListener('offline', () => {
  toast('✈ Offline — flights save locally', 'warn');
  updateSyncIndicator();
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      // Check for updates immediately and every 60s
      reg.update().catch(() => {});
      setInterval(() => reg.update().catch(() => {}), 60000);

      // Listen for new service worker installing
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        if (!newWorker) return;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            // A new version is ready (only prompt if there's already a controller,
            // meaning this isn't a first install)
            showUpdateBanner(newWorker);
          }
        });
      });
    }).catch(err => console.warn('SW registration failed:', err));

    // When a new SW takes control, reload
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloading) return;
      reloading = true;
      window.location.reload();
    });
  });
}

function showUpdateBanner(newWorker) {
  const banner = document.createElement('div');
  banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:var(--orange);color:#fff;padding:14px;text-align:center;font-size:14px;font-weight:600;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,0.2);display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;';
  banner.innerHTML = `
    <span>🎉 New version available</span>
    <button id="updateNowBtn" style="background:#fff;color:var(--orange);border:none;padding:8px 16px;border-radius:6px;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px;">Update Now</button>
    <button id="updateLaterBtn" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.5);padding:8px 14px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:13px;">Later</button>
  `;
  document.body.appendChild(banner);
  document.getElementById('updateNowBtn').onclick = () => {
    newWorker.postMessage({ type: 'SKIP_WAITING' });
    // controllerchange listener will trigger reload
  };
  document.getElementById('updateLaterBtn').onclick = () => {
    banner.remove();
  };
}
